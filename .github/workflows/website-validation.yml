name: Website validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tracked JavaScript
        run: |
          git ls-files -z '*.js' | xargs -0 -r -n 1 node --check
      - run: node tests/engine.test.js
      - run: node tests/combat.test.js
